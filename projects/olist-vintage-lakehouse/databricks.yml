bundle:
  name: olist-vintage-lakehouse

include:
  - resources/*.yml

sync:
  exclude:
    - build/**
    - dist/**
    - "*.egg-info/**"
variables:
  catalog:
    default: workspace
  raw_path:
    default: /Volumes/workspace/bronze/raw

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-5f27b5b2-72da.cloud.databricks.com
  azure:
    mode: development
    workspace:
      host: https://adb-7405618521447204.4.azuredatabricks.net
    variables:
      catalog: dbw_olist_learning
      raw_path: /Volumes/dbw_olist_learning/bronze/raw
  azure_tf:
    mode: development
    workspace:
      host: https://adb-7405606316668844.4.azuredatabricks.net
    variables:
      catalog: dbw_olist_tf
      raw_path: /Volumes/dbw_olist_tf/bronze/raw
